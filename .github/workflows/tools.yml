name: tools

# The mint-token test (AGT-4) on pull requests that change tools/.
on:
  pull_request:
    paths:
      - tools/**
      - .github/workflows/tools.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s tools/agent -v
